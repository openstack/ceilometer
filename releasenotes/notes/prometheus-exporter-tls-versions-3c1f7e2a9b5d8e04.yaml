---
features:
  - |
    The Prometheus exporter now accepts the ``[polling] prometheus_tls_min_version``
    and ``prometheus_tls_max_version`` options (``1.2`` or ``1.3``) to restrict the
    TLS protocol versions accepted by the scrape endpoint. Both default to
    ``1.3``. They only take effect when ``prometheus_tls_enable`` is set.
upgrade:
  - |
    When TLS is enabled for the Prometheus exporter, both the minimum and
    maximum TLS versions now default to ``1.3``. Prometheus scrapers that do
    not support TLS 1.3 will fail to scrape the endpoint. To allow TLS 1.2,
    set ``[polling] prometheus_tls_min_version`` to ``1.2``; the maximum can
    remain at its default of ``1.3``.
  - |
    The Prometheus exporter now requires ``prometheus-client`` 0.26.0 or newer.
